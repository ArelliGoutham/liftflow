name: Close Stale PRs

on:
  schedule:
    - cron: '0 2 * * 1'  # Runs every Monday at 2 AM UTC

jobs:
  close-stale:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Close stale pull requests
        uses: actions/stale@v9
        with:
          stale-pr-message: |
            This PR has been inactive for 30 days and is marked as stale.
            It will be closed in 7 days if there is no further activity.
            To keep it open, add a comment or push a commit.
          close-pr-message: |
            This PR was closed due to inactivity.
            Feel free to reopen if you're still working on it.
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: stale
          exempt-pr-labels: pinned,security
